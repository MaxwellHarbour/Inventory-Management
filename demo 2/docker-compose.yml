version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventorydb
      MYSQL_USER: java_user
      MYSQL_PASSWORD: temp_pass
    ports:
      - "3306:3306"
    volumes:
      - mysqldb_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: demo_app
    environment:
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: inventorydb
      DB_USERNAME: java_user
      DB_PASSWORD: temp_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-local:29092
    ports:
      - "8080:8080"
    depends_on:
      mysqldb:
        condition: service_started
      Kafka:
        condition: service_started

  Kafka:
    image: apache/kafka:latest
    container_name: kafka-local
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-local:9093"

      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-local:29092,EXTERNAL://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
 
 
volumes:
  mysqldb_data:
